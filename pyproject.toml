[project]
name = "my-python"
version = "0.1.0"
description = "TaskHub starter project with FastAPI and SQLAlchemy"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.117.0",
    "uvicorn[standard]>=0.24.0",
    "sqlalchemy>=2.0.0",
    "python-dotenv>=1.0.0",
    "alembic>=1.12.0",
    "email-validator>=1.3.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.22",
]
